<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Orçamento</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">

</head>
<body>
    
    <nav>
        <h1>Calculadora de Orçamento</h1>
    </nav>

    <main>
        <section class="content">
            <form class="form">
                <div class="input-row">
                    <div class="input-group">
                        <span>Nome do Projeto</span>
                        <label for="projectName">
                            <img class="inputIcon" src="img/icons/project.svg" alt="Nome do Projeto">
                            <input type="text" name="" id="projectName" placeholder="Máx: 120 caracteres" maxlength="120">
                        </label>
                    </div>

                    <div class="input-group">
                        <span for="budgetType">Tipo</span>
                        <select id="projectType">
                            <option value="CAPEX" selected>CAPEX</option>
                            <option value="OPEX">OPEX</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <span>Qual é o orçamento do projeto?</span>
                    <label for="budgetTotal">
                        <img class="inputIcon" src="img/icons/budget.svg" alt="Orçamento do projeto">
                        <input type="text" name="" id="budgetTotal" placeholder="Ex: 1.000.000" min="0">
                    </label>
                </div>

                <div class="input-group">
                    <span>Quanto há disponível?</span>
                    <label for="budgetLeft">
                        <img class="inputIcon" src="img/icons/coin.svg" alt="Dinheiro restante no projeto">
                        <input type="text" name="" id="budgetLeft" placeholder="Ex: 500.000,00" min="0">
                    </label>
                </div>

                <div class="input-group">
                    <span>Custo da Compra</span>
                    <label for="purchaseCost">
                        <select id="currencySelect">
                            <option value="BRL" selected>R$</option>
                            <option value="USD">$</option>
                            <option value="EUR">&euro;</option>
                        </select>
                        <input type="text" id="purchaseCost" placeholder="Ex: 10.000,00">
                    </label>
                    <div class="exchangeDialog">
                        <span class="exchangeText">a</span>
                    </div>
                </div>
                
                <div class="errorDialog">
                    <span class="errorMessage"></span>
                </div>

                <div class="input-row">
                    <button id="btnSubmit" disabled>Calcular</button>
                    <button id="btnReset" type="reset">
                        <img class="inputIcon" src="img/icons/reset.svg" alt="Resetar">
                    </button>
                </div>


            </form>

            <hr class="vertical-line">
            
            <div class="result">
                <div class="resultGraph">
                    <div id="chart"></div>
                </div>
                <div class="resultText">
                    <h4>Justificativa:</h4>
                    <span id="purchaseMotive"></span>
                </div>
                <div class="resultButton">
                    <button id="btnCopy">
                        <img class="inputIcon" src="img/icons/copy.svg" alt="Copiar texto">
                        <span class="btnText">Copiar Texto</span>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <a href="https://github.com/andre-fe-santana" target="_blank">
                <img src="img/icons/github.svg" alt="Logo do GitHub">
                <span>@andre_fe_santana</span>
            </a>
        </div>
    </footer>

    <script type="module" src="js/script.js"></script>
    <script type="module" src="js/chart.js" ></script>
    <script type="module" src="js/exchange.js" ></script>

</body>
</html>
